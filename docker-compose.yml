# Пряжник на домашнем сервере. Порт 8443 для локального доступа по Wi-Fi.
name: yarntracker

services:
  app:
    build: .
    image: yarntracker:local
    restart: unless-stopped
    ports:
      - "${LAN_BIND_IP:-0.0.0.0}:8443:8443"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      CERT_FILE: /certs/cert.pem
      KEY_FILE: /certs/key.pem
      STATIC_DIR: /app/dist
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8443"
    volumes:
      - ./data:/data
      - ./certs/cert.pem:/certs/cert.pem:ro
      - ./certs/key.pem:/certs/key.pem:ro
