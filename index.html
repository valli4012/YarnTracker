<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <!-- Иконка ярлыка на iOS: непрозрачный PNG 180x180, Safari не принимает SVG и альфа-канал -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Запасной путь для Android: если PWA не установилась, Chrome берёт иконку ярлыка из rel=icon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8F7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Пряжа" />
    <title>Учёт пряжи</title>
    <script>
      // Диагностика: если приложение не стартовало (например, на старом Safari), покажем причину
      function showErr(m) { var r = document.getElementById('root'); if (r && !r.childElementCount) r.innerHTML = '<pre style="padding:16px;white-space:pre-wrap;font:12px monospace;color:#B3261E"></pre>', r.firstChild.textContent = m; }
      window.addEventListener('error', function (e) { showErr(e.message + ' ' + (e.filename || '') + ':' + e.lineno); });
      window.addEventListener('unhandledrejection', function (e) { showErr(String(e.reason)); });
      setTimeout(function () { showErr('Приложение не запустилось: скрипт не загрузился или не поддерживается.'); }, 5000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
